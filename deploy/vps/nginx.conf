# /etc/nginx/sites-available/redact  (then: ln -s ../sites-available/redact /etc/nginx/sites-enabled/)
server {
    listen 80;
    listen [::]:80;
    server_name redact.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name redact.example.com;

    # certbot fills in ssl_certificate / ssl_certificate_key
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/redact/app/public;
    index index.php;
    charset utf-8;
    client_max_body_size 32m;
    server_tokens off;

    # Security headers are set by the application (CSP with nonces, HSTS, ...).

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets are fingerprinted: cache them for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Only the front controller executes PHP.
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/redact.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }

    # No dotfiles, except the security.txt route handled by the app.
    location ~ /\.(?!well-known) { deny all; }
}
